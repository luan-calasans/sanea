<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Cadastro - Sanea</title>
    <link rel="icon" type="image/webp" th:href="@{/favicon.webp}">
    <th:block th:replace="~{fragments/fonts :: links}"></th:block>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:if="${recaptchaEnabled}" src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
<div class="auth-shell">
    <div class="auth-card auth-card--wide">
        <div class="auth-logo">
            <a th:href="@{/login}" aria-label="Sanea">
                <img th:src="@{/img/logo.webp}" alt="Sanea" width="56" height="56">
            </a>
        </div>
        <h1>Criar conta</h1>
        <p>O cadastro público é exclusivo para cidadãos. Contas internas são criadas pela administração.</p>
        <div th:if="${erro}" class="alert alert-error" th:text="${erro}"></div>
        <form th:action="@{/cadastro}" th:object="${form}" method="post" class="stack">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="field">
                <label for="nome">Nome</label>
                <input id="nome" th:field="*{nome}" type="text" required maxlength="150">
            </div>
            <div class="field">
                <label for="email">E-mail</label>
                <input id="email" th:field="*{email}" type="email" required maxlength="180">
            </div>
            <div class="grid-2">
                <div class="field">
                    <label for="senha">Senha</label>
                    <input id="senha" th:field="*{senha}" type="password" required minlength="8" maxlength="72">
                </div>
                <div class="field">
                    <label for="confirmacaoSenha">Confirmar senha</label>
                    <input id="confirmacaoSenha" th:field="*{confirmacaoSenha}" type="password" required minlength="8">
                </div>
            </div>
            <div class="field auth-recaptcha" th:if="${recaptchaEnabled}">
                <div class="g-recaptcha" th:attr="data-sitekey=${recaptchaSiteKey}"></div>
            </div>
            <button class="btn btn-primary" type="submit">Cadastrar</button>
        </form>
        <div class="auth-links">
            <p><a th:href="@{/login}">Já tenho conta</a></p>
            <p><a th:href="@{/consulta}">Consultar protocolo</a></p>
        </div>
    </div>
</div>
</body>
</html>

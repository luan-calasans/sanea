<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout (content)"
      th:data-theme="${aparencia != null and aparencia.dark ? 'dark' : 'light'}"
      th:style="${aparencia != null ? aparencia.cssVariables() : ''}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="theme-color" th:content="${aparencia != null ? aparencia.corSidebar : '#0251A3'}">
    <title th:text="${pageTitle} ?: 'Sanea'">Sanea</title>
    <link rel="icon" type="image/webp" th:href="@{/favicon.webp}">
    <th:block th:replace="~{fragments/pwa :: head}"></th:block>
    <th:block th:replace="~{fragments/fonts :: links}"></th:block>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
<div id="nav-progress" aria-hidden="true"></div>

<div class="layout-admin">
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <aside class="sidebar" id="sidebar" aria-label="Menu lateral">
        <div class="sidebar__brand">
            <a class="brand" th:href="@{/inicio}" aria-label="Sanea">
                <img class="brand__logo" th:src="@{/img/logo.webp}" alt="Sanea" width="48" height="48">
            </a>
        </div>

        <nav class="sidebar__nav" aria-label="Principal">
            <a class="sidebar__link" sec:authorize="isAuthenticated()" th:href="@{/chamados}">
                <svg class="sidebar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
                <span>Chamados</span>
            </a>
            <a class="sidebar__link" sec:authorize="hasAuthority('CHAMADO_CRIAR')" th:href="@{/chamados/novo}">
                <svg class="sidebar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
                <span>Abrir chamado</span>
            </a>
            <a class="sidebar__link" sec:authorize="hasAuthority('DASHBOARD_VISUALIZAR')" th:href="@{/dashboard}">
                <svg class="sidebar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
                <span>Dashboard</span>
            </a>
            <a class="sidebar__link" sec:authorize="hasAuthority('USUARIO_GERENCIAR')" th:href="@{/admin}">
                <svg class="sidebar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span>Administração</span>
            </a>
            <a class="sidebar__link" sec:authorize="isAuthenticated()" th:href="@{/conta}">
                <svg class="sidebar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="3.5"/><path d="M5 19c1.2-3.2 3.5-4.8 7-4.8s5.8 1.6 7 4.8"/></svg>
                <span>Minha conta</span>
            </a>
            <a class="sidebar__link" sec:authorize="!isAuthenticated()" th:href="@{/login}">
                <svg class="sidebar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 21V3"/></svg>
                <span>Entrar</span>
            </a>
        </nav>

        <div class="sidebar__account" sec:authorize="isAuthenticated()">
            <div class="sidebar__account-meta">
                <strong sec:authentication="principal.nome">Usuário</strong>
                <span sec:authentication="principal.perfilCodigo">PERFIL</span>
            </div>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sidebar-exit btn-sm" type="submit">Sair</button>
            </form>
        </div>
    </aside>

    <div class="admin-main">
        <header class="topbar topbar--mobile">
            <button type="button" class="menu-toggle" id="sidebar-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menu">
                <svg class="menu-toggle__icon" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                    <path class="menu-toggle__line menu-toggle__line--top" d="M3 5h14"/>
                    <path class="menu-toggle__line menu-toggle__line--mid" d="M3 10h14"/>
                    <path class="menu-toggle__line menu-toggle__line--bot" d="M3 15h14"/>
                </svg>
            </button>
            <div class="topbar__spacer" aria-hidden="true"></div>
            <div class="topbar__user">
                <div class="topbar__meta" sec:authorize="isAuthenticated()">
                    <strong sec:authentication="principal.nome">Usuário</strong>
                    <span class="muted small" sec:authentication="principal.perfilCodigo">PERFIL</span>
                </div>
                <a class="btn btn-secondary btn-sm" sec:authorize="!isAuthenticated()" th:href="@{/login}">Entrar</a>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-secondary btn-sm" type="submit">Sair</button>
                </form>
            </div>
        </header>

        <main id="conteudo" class="content page-enter">
            <div th:if="${sucesso}" class="alert alert-success" role="status" th:text="${sucesso}"></div>
            <div th:if="${erro}" class="alert alert-error" role="alert" th:text="${erro}"></div>
            <div th:insert="${content}"></div>
        </main>
    </div>
</div>

<script th:src="@{/js/app.js}" defer></script>
<th:block th:replace="~{fragments/pwa :: scripts}"></th:block>
</body>
</html>

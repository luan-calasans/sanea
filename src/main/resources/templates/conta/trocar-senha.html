<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::section})}">
<body>
<section>
    <div class="page-header">
        <div>
            <h1>Trocar senha</h1>
            <p th:if="${obrigatorio}" class="alert alert-warning">É necessário trocar a senha inicial antes de continuar.</p>
        </div>
    </div>
    <form class="surface stack" style="max-width:520px;" th:action="@{/conta/trocar-senha}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="field">
            <label for="senhaAtual">Senha atual</label>
            <input id="senhaAtual" name="senhaAtual" type="password" required>
        </div>
        <div class="field">
            <label for="novaSenha">Nova senha</label>
            <input id="novaSenha" name="novaSenha" type="password" required minlength="8">
        </div>
        <div class="field">
            <label for="confirmacao">Confirmação</label>
            <input id="confirmacao" name="confirmacao" type="password" required minlength="8">
        </div>
        <button class="btn btn-primary" type="submit">Salvar senha</button>
    </form>
</section>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::section})}">
<body>
<section class="account-page">
    <div class="page-header">
        <div>
            <h1>Minha conta</h1>
            <p>Gerencie seus dados e acompanhe seus chamados.</p>
        </div>
        <a class="btn btn-primary" sec:authorize="hasAuthority('CHAMADO_CRIAR')" th:href="@{/chamados/novo}">Abrir novo chamado</a>
    </div>

    <div class="grid-2 account-grid">
        <div class="stack account-grid__col">
            <section class="surface stack">
                <h2>Dados pessoais</h2>
                <dl class="account-meta">
                    <div>
                        <dt>E-mail</dt>
                        <dd th:text="${usuario.email}"></dd>
                    </div>
                    <div>
                        <dt>Perfil</dt>
                        <dd th:text="${perfilNome}"></dd>
                    </div>
                </dl>

                <form class="account-form stack" th:action="@{/conta/nome}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="field">
                        <label for="nome">Nome</label>
                        <input id="nome" name="nome" type="text" th:value="${usuario.nome}" required>
                    </div>
                    <div class="actions">
                        <button class="btn btn-secondary" type="submit">Salvar nome</button>
                    </div>
                </form>
            </section>

            <section class="surface stack">
                <h2>Segurança</h2>
                <form class="account-form stack" th:action="@{/conta/email}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="field">
                        <label for="novoEmail">Novo e-mail</label>
                        <input id="novoEmail" name="novoEmail" type="email" required>
                        <span class="field-hint">Será exigida nova verificação por e-mail.</span>
                    </div>
                    <div class="actions">
                        <button class="btn btn-secondary" type="submit">Solicitar alteração</button>
                    </div>
                </form>
                <div class="actions">
                    <a class="btn btn-primary" th:href="@{/conta/trocar-senha}">Trocar senha</a>
                </div>
            </section>
        </div>

        <section class="surface stack">
            <h2>Meus chamados</h2>
            <div class="empty-state" th:if="${meusChamados.totalElements == 0}">Você ainda não abriu chamados.</div>
            <div class="table-wrap" th:if="${meusChamados.totalElements > 0}">
                <table>
                    <thead><tr><th>Protocolo</th><th>Status</th><th>Aberto em</th></tr></thead>
                    <tbody>
                    <tr th:each="c : ${meusChamados.content}">
                        <td data-label="Protocolo"><a th:href="@{/chamados/{id}(id=${c.id})}" th:text="${c.protocolo}"></a></td>
                        <td data-label="Status"><span class="badge" th:classappend="'badge-' + ${c.status.name()}" th:text="${c.statusRotulo}"></span></td>
                        <td data-label="Aberto em" th:text="${c.abertoEmFormatado}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="actions">
                <a th:href="@{/chamados}">Ver listagem completa</a>
            </div>
        </section>
    </div>
</section>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::section})}">
<body>
<section>
    <div class="page-header">
        <div>
            <h1>Administração de usuários</h1>
            <p>Crie contas internas e gerencie ativação e perfis.</p>
        </div>
        <div class="actions">
            <a class="btn btn-secondary" th:href="@{/admin/tipos}">Tipos</a>
            <a class="btn btn-secondary" th:href="@{/admin/auditoria}">Auditoria</a>
        </div>
    </div>

    <section class="surface stack">
        <h2>Novo usuário interno</h2>
        <form th:action="@{/admin/usuarios}" method="post" class="form-grid">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="field">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" type="text" required maxlength="150" autocomplete="name">
            </div>
            <div class="field">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" required maxlength="180" autocomplete="email">
            </div>
            <div class="field">
                <label for="senha">Senha inicial</label>
                <input id="senha" name="senha" type="password" required minlength="8" autocomplete="new-password">
            </div>
            <div class="field">
                <label for="perfilCodigo">Perfil</label>
                <select id="perfilCodigo" name="perfilCodigo" required>
                    <option th:each="p : ${perfis}" th:if="${p.codigo != 'CIDADAO'}" th:value="${p.codigo}" th:text="${p.nome}"></option>
                </select>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Criar</button>
            </div>
        </form>
    </section>

    <section class="surface" style="margin-top:1.5rem;">
        <form method="get" class="form-inline-filters">
            <div class="field">
                <label for="termo">Busca</label>
                <input id="termo" name="termo" type="search" th:value="${termo}" placeholder="Nome ou e-mail">
            </div>
            <div class="field">
                <label for="perfil">Perfil</label>
                <select id="perfil" name="perfil">
                    <option value="">Todos</option>
                    <option th:each="p : ${perfis}" th:value="${p.codigo}" th:text="${p.nome}" th:selected="${perfil == p.codigo}"></option>
                </select>
            </div>
            <div class="field-actions">
                <button class="btn btn-secondary" type="submit">Filtrar</button>
            </div>
        </form>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Perfil</th>
                    <th>Ativo</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${page.content}">
                    <td data-label="Nome" th:text="${u.nome}"></td>
                    <td data-label="E-mail" th:text="${u.email}"></td>
                    <td data-label="Perfil">
                        <form th:action="@{/admin/usuarios/{id}/perfil(id=${u.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <select name="perfilCodigo" onchange="this.form.submit()" aria-label="Alterar perfil">
                                <option th:each="p : ${perfis}" th:value="${p.codigo}" th:text="${p.nome}" th:selected="${u.perfil.codigo == p.codigo}"></option>
                            </select>
                        </form>
                    </td>
                    <td data-label="Ativo">
                        <span class="status-dot"
                              th:classappend="${u.ativo} ? ' status-dot--on' : ' status-dot--off'"
                              th:title="${u.ativo} ? 'Ativo' : 'Inativo'"
                              th:text="${u.ativo} ? 'Ativo' : 'Inativo'">Ativo</span>
                    </td>
                    <td data-label="Ações">
                        <form th:action="@{/admin/usuarios/{id}/ativo(id=${u.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="ativo" th:value="${!u.ativo}">
                            <button class="btn btn-secondary btn-sm" type="submit" th:text="${u.ativo} ? 'Desativar' : 'Ativar'"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</section>
</body>
</html>

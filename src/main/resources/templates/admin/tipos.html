<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::section})}">
<body>
<section>
    <div class="page-header">
        <div>
            <h1>Tipos de chamado</h1>
            <p>Tipos desativados permanecem associados a chamados antigos.</p>
        </div>
        <a class="btn btn-secondary" th:href="@{/admin/usuarios}">Voltar</a>
    </div>

    <section class="surface stack">
        <h2>Novo / atualização rápida</h2>
        <form th:action="@{/admin/tipos}" method="post" class="form-grid">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="field">
                <label for="codigo">Código</label>
                <input id="codigo" name="codigo" type="text" required placeholder="VAZAMENTO_ESGOTO">
            </div>
            <div class="field">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" type="text" required>
            </div>
            <div class="field">
                <label for="descricao">Descrição</label>
                <input id="descricao" name="descricao" type="text">
            </div>
            <div class="field">
                <label for="ordem">Ordem</label>
                <input id="ordem" name="ordem" type="number" value="0">
            </div>
            <div class="form-actions">
                <label class="actions" style="align-items:center;min-height:44px;">
                    <input type="checkbox" name="ativo" value="true" checked>
                    Ativo
                </label>
                <button class="btn btn-primary" type="submit">Salvar</button>
            </div>
        </form>
    </section>

    <section class="surface" style="margin-top:1.5rem;">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Nome</th>
                    <th>Ativo</th>
                    <th>Ordem</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tipos}">
                    <td data-label="Código" th:text="${t.codigo}"></td>
                    <td data-label="Nome" th:text="${t.nome}"></td>
                    <td data-label="Ativo">
                        <span class="status-dot"
                              th:classappend="${t.ativo} ? ' status-dot--on' : ' status-dot--off'"
                              th:title="${t.ativo} ? 'Ativo' : 'Inativo'"
                              th:text="${t.ativo} ? 'Ativo' : 'Inativo'">Ativo</span>
                    </td>
                    <td data-label="Ordem" th:text="${t.ordem}"></td>
                    <td data-label="Ações">
                        <form th:action="@{/admin/tipos}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="id" th:value="${t.id}">
                            <input type="hidden" name="codigo" th:value="${t.codigo}">
                            <input type="hidden" name="nome" th:value="${t.nome}">
                            <input type="hidden" name="descricao" th:value="${t.descricao}">
                            <input type="hidden" name="ordem" th:value="${t.ordem}">
                            <input type="hidden" name="ativo" th:value="${!t.ativo}">
                            <button class="btn btn-secondary btn-sm" type="submit" th:text="${t.ativo} ? 'Desativar' : 'Ativar'"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</section>
</body>
</html>
